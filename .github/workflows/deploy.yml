name: deploy

# Preview deploy per PR (a Worker version with a preview URL) and production on main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one at a time, in order.
concurrency:
  group: deploy-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm types
      - run: pnpm check
      - run: pnpm build
      - name: Upload preview version
        if: github.event_name == 'pull_request'
        run: pnpm wrangler versions upload --preview-alias "pr-${{ github.event.number }}"
      - name: Deploy production
        if: github.event_name != 'pull_request'
        # Ships code only: the custom domain is managed in Cloudflare, not in wrangler.jsonc.
        run: |
          version=$(pnpm wrangler versions upload --message "$GITHUB_SHA" | tee /dev/stderr | sed -n 's/^Worker Version ID: //p')
          pnpm wrangler versions deploy "$version@100%" --yes
